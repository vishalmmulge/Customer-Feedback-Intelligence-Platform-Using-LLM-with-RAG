# ---------------------------------------------------------------
# Docker Compose — Customer Feedback Intelligence Platform
#
# Services:
#   ollama    - local LLM/embedding inference (http://ollama:11434)
#   backend   - FastAPI API (http://backend:8000)
#   frontend  - Streamlit dashboard (http://frontend:8501)
#
# Inter-container networking rule:
#   * backend -> Ollama: http://ollama:11434   (service name, NOT localhost)
#   * frontend -> backend: http://backend:8000 (service name, NOT localhost)
#
# Persistent volumes keep data across container recreation.
# ---------------------------------------------------------------

services:
  ollama:
    build:
      context: .
      dockerfile: ollama/Dockerfile
    container_name: cf-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_models:/root/.ollama
    networks:
      - app-network
    environment:
      - OLLAMA_MODELS=nomic-embed-text llama3.2:3b
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:11434/api/tags"]
      interval: 30s
      timeout: 10s
      start_period: 90s
      retries: 5
    # CPU-only by default. Uncomment the next lines to enable GPU:
    # deploy:
    #   resources:
    #     reservations:
    #       devices:
    #         - driver: nvidia
    #           count: 1
    #           capabilities: [gpu]

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: cf-backend
    ports:
      - "8000:8000"
    depends_on:
      ollama:
        condition: service_healthy
    networks:
      - app-network
    volumes:
      - feedback_data:/data
      - vector_index:/app/backend/index
      - uploads:/app/data/uploads
    environment:
      - OLLAMA_BASE_URL=http://ollama:11434
      - DATABASE_PATH=/data/feedback.db
      - EVALUATION_DATASET_PATH=/data/evaluation_dataset.jsonl
      - UPLOAD_DIRECTORY=/app/data/uploads
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    container_name: cf-frontend
    ports:
      - "8501:8501"
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - app-network
    environment:
      - BACKEND_URL=http://backend:8000
      - LOG_LEVEL=INFO
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8501/_stcore/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

networks:
  app-network:
    driver: bridge

volumes:
  ollama_models:
    driver: local
  feedback_data:
    driver: local
  vector_index:
    driver: local
  uploads:
    driver: local
